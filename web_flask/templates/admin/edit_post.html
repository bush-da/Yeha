{% extends 'admin/base_admin.html' %}

{% block title %}Edit Post{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Edit Post</h1>
    <form method="POST">
        <div class="form-group">
            <label>Title</label>
            <input type="text" class="form-control" name="title" value="{{ post.title }}" required>
        </div>
        <div class="form-group">
            <label>Content</label>
            <textarea class="form-control" name="content" rows="5" required>{{ post.content }}</textarea>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select class="form-control" name="is_published">
                <option value="1" {% if post.is_published %}selected{% endif %}>Published</option>
                <option value="0" {% if not post.is_published %}selected{% endif %}>Draft</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin.admin_posts') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
