{% extends 'admin/base_admin.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Edit User</h1>
    <form method="POST">
        <div class="form-group">
            <label>Name</label>
            <input type="text" class="form-control" name="name" value="{{ user.username }}" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
        </div>
	<div class="form-group">
	  <label>Role</label>
	  <select class="form-control" name="role">
            <option value="admin" {% if user.is_admin %}selected{% endif %}>Admin</option>
            <option value="user" {% if not user.is_admin %}selected{% endif %}>User</option>
	  </select>
	</div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin.admin_users') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
